# ============================================================
# Database
# ============================================================

# The demo stores everything in a file-based H2 database under data/. Delete that folder to start
# over with the sample data.
spring.datasource.url=jdbc:h2:./data/usermanagerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The schema of the appjar is created and updated by Hibernate, so no migration tool is needed.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Vaadin
# ============================================================

vaadin.launch-browser=true
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.appjars

# ============================================================
# User Manager - view routes
# ============================================================
# Every screen the appjar adds can be moved to a different URL. The values below are the defaults,
# left explicit so this file doubles as the list of routes the application registers.

# List of user accounts
com.appjars.usermanager.url.users=um/users

# Editor that creates a user account
com.appjars.usermanager.url.users-create=um/users/create

# Editor that updates an existing user account
com.appjars.usermanager.url.users-edit=um/users/edit

# Public screen a new user opens from a registration link to set their password
com.appjars.usermanager.url.user-registration-link=um/users/register

# Public screen a user opens from a password reset link
com.appjars.usermanager.url.password-change-link=um/users/password-reset

# List of user groups
com.appjars.usermanager.url.groups=um/groups

# Editor that creates a user group
com.appjars.usermanager.url.groups-create=um/groups/create

# Editor that updates an existing user group
com.appjars.usermanager.url.groups-edit=um/groups/edit

# List of roles
com.appjars.usermanager.url.roles=um/roles

# Profile of the signed-in user
com.appjars.usermanager.url.profile=um/profile

# List and editor of the runtime access rules
com.appjars.usermanager.url.access-rules=um/access-rules

# Audit of every registered route and the rule that governs it
com.appjars.usermanager.url.views=um/views

# List of external authentication providers (OAuth2)
com.appjars.usermanager.url.auth-providers=um/auth-providers

# ============================================================
# User Manager - registration and password reset links
# ============================================================

# Days a new registration or password reset link stays valid, offered as the default in the dialog
com.appjars.usermanager.default.days.expiration=7

# Highest number of days the dialog accepts for a link
com.appjars.usermanager.maximum.days.expiration=99

# Base URL the generated links point at, so they work from outside the machine running the demo
com.appjars.usermanager.external-url=http://localhost:8080/

# Where a user is sent once the link has been used
# Example: /um/profile
com.appjars.usermanager.links.redirect.url=

# ============================================================
# User Manager - security
# ============================================================

# Key used to encode passwords
com.appjars.usermanager.encoding.secret.key=1234567890

# Base64-encoded AES-256 key (32 raw bytes) that encrypts the stored OAuth2 client secrets. Only
# required when external authentication providers are used.
com.appjars.usermanager.external-auth.secret.key=

# Whether the appjar declares the registration link, the password reset link and the external
# authentication entry points as permitAll(). Set it to false to protect those paths yourself.
com.appjars.usermanager.security.permit-public-links=
