appjars.usermanager.demo.tour.home.intro.title=Welcome
appjars.usermanager.demo.tour.home.intro.desc=This is the public landing page of the User Manager demo. It is the only screen an anonymous visitor can open, and it introduces what the appjar gives your application before you sign in.
appjars.usermanager.demo.tour.home.features.title=What you get
appjars.usermanager.demo.tour.home.features.desc=Each card is one capability the appjar brings ready-made: users, groups, roles, runtime access rules and the view audit. The tours in the Tour menu walk the screen behind each of them.
appjars.usermanager.demo.tour.home.tryit.title=The demo accounts
appjars.usermanager.demo.tour.home.tryit.desc=Three accounts with deliberately different reach, so you can see the access rules decide. Sign in as each and watch the drawer and the Tour menu shrink to what that account may open.
appjars.usermanager.demo.tour.home.license.title=Free mode
appjars.usermanager.demo.tour.home.license.desc=The appjar runs unlicensed with a cap on how much data you can create, which is what this demo runs on. A licence lifts the cap without changing a line of code.
appjars.usermanager.demo.tour.home.links.title=Where to go next
appjars.usermanager.demo.tour.home.links.desc=The documentation covers configuration and the parts no demo can show. That is the whole landing page, so pick a tour from the Tour menu and start with Getting around.

appjars.usermanager.demo.tour.navigation.intro.title=Getting around
appjars.usermanager.demo.tour.navigation.intro.desc=The drawer on the left is the whole application: one entry per screen the AppJar adds. Let''s go through them.
appjars.usermanager.demo.tour.navigation.home.title=Home
appjars.usermanager.demo.tour.navigation.home.desc=This landing page. It stays reachable without logging in, and it is where the guided tours start from.
appjars.usermanager.demo.tour.navigation.profile.title=Profile
appjars.usermanager.demo.tour.navigation.profile.desc=Your own account: the groups and roles you hold, and a dialog to change your password. Every authenticated user has it.
appjars.usermanager.demo.tour.navigation.users.title=Users
appjars.usermanager.demo.tour.navigation.users.desc=The account list. Create, edit, enable, disable and delete users, and hand out registration or password-reset links.
appjars.usermanager.demo.tour.navigation.groups.title=Groups
appjars.usermanager.demo.tour.navigation.groups.desc=Bundles of roles you grant to many users at once, so permissions are managed per team rather than per person.
appjars.usermanager.demo.tour.navigation.roles.title=Roles
appjars.usermanager.demo.tour.navigation.roles.desc=The role names your application checks. Users, groups and access rules all refer back to this list.
appjars.usermanager.demo.tour.navigation.providers.title=Auth providers
appjars.usermanager.demo.tour.navigation.providers.desc=External authentication: the OAuth2 providers your users may sign in with, added and edited at runtime like everything else here.
appjars.usermanager.demo.tour.navigation.rules.title=Access rules
appjars.usermanager.demo.tour.navigation.rules.desc=Prioritized rules that decide which roles reach which URLs, editable at runtime with no redeploy. The first rule that matches a view decides, and what its criteria does not grant is denied right there.
appjars.usermanager.demo.tour.navigation.views.title=Views
appjars.usermanager.demo.tour.navigation.views.desc=The audit of those rules: every route the application registers, the rule that governs it and who actually gets in.
appjars.usermanager.demo.tour.navigation.accounts.title=Now compare the accounts
appjars.usermanager.demo.tour.navigation.accounts.desc=The drawer offers the same entries to everyone, but the access rules decide who actually gets in. Log in as <b>admin / admin</b> and every screen opens. As <b>maria / maria</b>, Roles, Access rules and Views are refused. As <b>diego / diego</b>, Users and Groups are refused as well. Try all three, click your way around, and see for yourself - then open Views as admin to read exactly which rule did it.

appjars.usermanager.demo.tour.profile.intro.title=My profile
appjars.usermanager.demo.tour.profile.intro.desc=Every authenticated user gets this page. It answers "who am I and what am I allowed to do" without giving access to any administration screen.
appjars.usermanager.demo.tour.profile.identity.title=Your account
appjars.usermanager.demo.tour.profile.identity.desc=The avatar and name identify the account you are signed in with.
appjars.usermanager.demo.tour.profile.groups.title=Your groups
appjars.usermanager.demo.tour.profile.groups.desc=The groups you belong to. Groups are the usual way to grant a set of roles to many users at once.
appjars.usermanager.demo.tour.profile.roles.title=Your roles
appjars.usermanager.demo.tour.profile.roles.desc=Every role you hold, whether granted directly or inherited from one of your groups. Access rules are evaluated against exactly this set.
appjars.usermanager.demo.tour.profile.password.title=Change your password
appjars.usermanager.demo.tour.profile.password.desc=Opens a dialog that asks for the current password and validates the new one against the configured password rules. It only appears for accounts that authenticate with a password.
appjars.usermanager.demo.tour.profile.finish.title=That''s the profile
appjars.usermanager.demo.tour.profile.finish.desc=Use the Tour menu in the header to walk through another screen, or the drawer to keep exploring on your own.

appjars.usermanager.demo.tour.users.intro.title=Users
appjars.usermanager.demo.tour.users.intro.desc=This is the screen your administrators live in: everything about accounts happens here.
appjars.usermanager.demo.tour.users.grid.title=The user list
appjars.usermanager.demo.tour.users.grid.desc=Each row shows an account, whether it is enabled, when it last logged in and the status of its registration link. Expand a row to see the roles and groups behind it.
appjars.usermanager.demo.tour.users.filters.title=Finding an account
appjars.usermanager.demo.tour.users.filters.desc=Fill in the fields to the left - username, availability, link status - and press Filter to narrow the list; Clear puts it back. On a phone the same fields move into a dialog behind this button.
appjars.usermanager.demo.tour.users.actions.title=Acting on an account
appjars.usermanager.demo.tour.users.actions.desc=The menu at the end of each row edits the user, enables or disables the account, deletes it, or creates a registration or password-reset link the user can follow to set their own password.
appjars.usermanager.demo.tour.users.create.title=Adding a user
appjars.usermanager.demo.tour.users.create.desc=New User opens the account editor. Press Next and it will open, so we can go through it together.
appjars.usermanager.demo.tour.users.username.title=The account name
appjars.usermanager.demo.tour.users.username.desc=The username is all a new account really needs, and it is fixed once the account exists. On an account that already exists, the button beside it hands out a registration or password-reset link.
appjars.usermanager.demo.tour.users.roles.title=Roles and groups
appjars.usermanager.demo.tour.users.roles.desc=Grant roles to this account directly here, or add it to groups in the field next to this one and let the groups carry the roles. What the account holds is the union of the two, so nothing is lost by granting a role both ways.
appjars.usermanager.demo.tour.users.summary.title=What the account will reach
appjars.usermanager.demo.tour.users.summary.desc=Every view this account will be able to open, recalculated as you pick roles and groups. It runs your access rules for you, so you see what a role actually unlocks before you save rather than after. Editing your own account so that you would lose these screens asks for confirmation on save.
appjars.usermanager.demo.tour.users.limit.title=Free mode
appjars.usermanager.demo.tour.users.limit.desc=We''ll leave the editor without saving. Unlicensed, the AppJar stops at 5 users and the counter above the list tells you how close you are. Everything else keeps working; a full license just lifts the cap.

appjars.usermanager.demo.tour.groups.intro.title=Groups
appjars.usermanager.demo.tour.groups.intro.desc=Groups bundle roles so you grant permissions per team instead of per person.
appjars.usermanager.demo.tour.groups.grid.title=The group list
appjars.usermanager.demo.tour.groups.grid.desc=Each row shows a group with how many users belong to it and how many roles it carries. Expand a row to edit it or hand out a link that lets someone join the group.
appjars.usermanager.demo.tour.groups.filters.title=Finding a group
appjars.usermanager.demo.tour.groups.filters.desc=Filter groups by name, or by the status of the registration link attached to them, and press Filter to apply; Clear puts the whole list back.
appjars.usermanager.demo.tour.groups.create.title=Adding a group
appjars.usermanager.demo.tour.groups.create.desc=Creates a group, picks the roles it grants and the users that belong to it. Changing a group''s roles updates every one of its members at once.
appjars.usermanager.demo.tour.groups.finish.title=That''s groups
appjars.usermanager.demo.tour.groups.finish.desc=Next, see the roles a group can grant, or the access rules that decide what those roles actually unlock.

appjars.usermanager.demo.tour.roles.intro.title=Roles
appjars.usermanager.demo.tour.roles.intro.desc=Roles are the names your application checks against. Everything else - users, groups, access rules - refers back to them.
appjars.usermanager.demo.tour.roles.grid.title=The role list
appjars.usermanager.demo.tour.roles.grid.desc=Each row shows a role and how many users and groups currently hold it, so you know the blast radius before renaming or deleting one.
appjars.usermanager.demo.tour.roles.filters.title=Finding a role
appjars.usermanager.demo.tour.roles.filters.desc=Type part of a role name and press Filter to jump straight to the one you care about; Clear puts the whole list back.
appjars.usermanager.demo.tour.roles.create.title=Adding a role
appjars.usermanager.demo.tour.roles.create.desc=Creates a role in a small dialog. It becomes immediately available to users, groups and access rules.
appjars.usermanager.demo.tour.roles.finish.title=That''s roles
appjars.usermanager.demo.tour.roles.finish.desc=A role by itself grants nothing. The access rules screen is where you say what each role can reach.

appjars.usermanager.demo.tour.rules.intro.title=Access rules
appjars.usermanager.demo.tour.rules.intro.desc=Access rules decide who may reach which URLs, and they are edited at runtime - no redeploy to change who sees what. Rules are checked in order and the first one that matches the view decides: its answer is final, and no later rule gets a say.
appjars.usermanager.demo.tour.rules.grid.title=The rule list
appjars.usermanager.demo.tour.rules.grid.desc=Each row shows what the rule matches, the authorization criteria it applies, the roles that criteria works on, and how many registered views it currently reaches. The row menu edits, duplicates or deletes it.
appjars.usermanager.demo.tour.rules.priority.title=Priority wins
appjars.usermanager.demo.tour.rules.priority.desc=Rules are evaluated in the order shown and the first match decides. Drag a row to change its priority.
appjars.usermanager.demo.tour.rules.filters.title=Finding a rule
appjars.usermanager.demo.tour.rules.filters.desc=Filter by matching type, by authorization criteria, or by the roles a rule names, then press Filter; that is how you find what is blocking a user. Clear puts the whole list back.
appjars.usermanager.demo.tour.rules.roleaccess.title=Access by role
appjars.usermanager.demo.tour.rules.roleaccess.desc=Views by role answers the opposite question: pick one or more roles and see, view by view, whether these rules let them in. Routes whose outcome depends on concrete route or query-parameter values are reported as conditional.
appjars.usermanager.demo.tour.rules.create.title=Adding a rule
appjars.usermanager.demo.tour.rules.create.desc=New Rule opens the editor. Press Next and it will open, so we can go through it together.
appjars.usermanager.demo.tour.rules.views.title=The views a rule covers
appjars.usermanager.demo.tour.rules.views.desc=By default a rule covers the views you chose by hand in the Views field - a plain list, no syntax involved.
appjars.usermanager.demo.tour.rules.advanced.title=Advanced options
appjars.usermanager.demo.tour.rules.advanced.desc=Advanced swaps the manual list for a pattern - a prefix, a suffix, a substring or a regular expression - so one rule can cover routes that do not exist yet. It also exposes the rule priority, and for the pattern types that match a whole URL, whether query parameters count as part of it.
appjars.usermanager.demo.tour.rules.authorization.title=How access is decided
appjars.usermanager.demo.tour.rules.authorization.desc=One criteria per rule, and it is the whole answer: unrestricted, any signed-in user, users holding all of the roles below, or users holding any of them. Whatever the criteria does not grant is denied right there.
appjars.usermanager.demo.tour.rules.roles.title=The roles it works on
appjars.usermanager.demo.tour.rules.roles.desc=The roles the criteria above is evaluated against, so this field only shows for the two role-based criteria. At least one role is required: a role-based rule with none grants nobody, so the editor refuses to save it.
appjars.usermanager.demo.tour.rules.finish.title=That''s access rules
appjars.usermanager.demo.tour.rules.finish.desc=We''ll close the editor without saving - and saving a rule that would lock you out asks for confirmation first. To check the outcome across your whole application, take the Views tour: it shows the effective access for every registered route.

appjars.usermanager.demo.tour.views.intro.title=Views
appjars.usermanager.demo.tour.views.intro.desc=This screen is the audit of your access rules: every route the application registers, and who actually gets in.
appjars.usermanager.demo.tour.views.grid.title=Every registered route
appjars.usermanager.demo.tour.views.grid.desc=The list is built from the running application, so a newly added view shows up here without any configuration.
appjars.usermanager.demo.tour.views.details.title=Why a view is reachable
appjars.usermanager.demo.tour.views.details.desc=Expand a row to see which rules match the view, which one is actually applied, the criteria that rule applies and the roles it names. A role that comes from the view''s own annotations rather than from a rule is marked as such.
appjars.usermanager.demo.tour.views.filters.title=Finding a view
appjars.usermanager.demo.tour.views.filters.desc=Filter by view name or by URL, then press Filter, when your application registers more routes than fit on one screen; Clear puts them all back.
appjars.usermanager.demo.tour.views.finish.title=That''s the whole tour
appjars.usermanager.demo.tour.views.finish.desc=Users, groups, roles, access rules and this audit are all the AppJar adds to a Spring Boot and Vaadin application. Add the dependency and they are yours.

appjars.usermanager.demo.tour.providers.intro.title=Auth providers
appjars.usermanager.demo.tour.providers.intro.desc=Besides its own accounts, User Manager can let users sign in through an external OAuth2 provider. This screen is where those providers are registered.
appjars.usermanager.demo.tour.providers.list.title=The provider list
appjars.usermanager.demo.tour.providers.list.desc=The demo ships without providers, so the list starts empty. A registered provider shows its type, whether it is enabled and the groups the users arriving through it are placed in.
appjars.usermanager.demo.tour.providers.create.title=Adding a provider
appjars.usermanager.demo.tour.providers.create.desc=Opens a dialog asking for the client id and client secret the provider issued you. The secret is encrypted before it is stored, with the key you configure in com.appjars.usermanager.external-auth.secret.key.
appjars.usermanager.demo.tour.providers.finish.title=That''s auth providers
appjars.usermanager.demo.tour.providers.finish.desc=Enabling a provider needs spring-boot-starter-oauth2-client on the classpath, which this demo leaves out: there is no client id to hand out publicly. Everything else on the screen works as it ships.
