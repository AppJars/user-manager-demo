# Home (public landing page)
appjars.usermanager.demo.home.title=User Manager AppJar - Demo
appjars.usermanager.demo.home.hero.logoAlt=AppJars
appjars.usermanager.demo.home.hero.title=User Manager AppJar
appjars.usermanager.demo.home.hero.tagline=Drop-in user, group, role and access-rule management for your Spring Boot + Vaadin application. Ready-made screens, services and database schema, so you never write authentication and authorization plumbing again.

appjars.usermanager.demo.home.features.title=What''s inside
appjars.usermanager.demo.home.features.users.title=User administration
appjars.usermanager.demo.home.features.users.desc=Create, edit, enable, disable and delete users from a filterable grid that shows each account''s roles, groups and last login at a glance.
appjars.usermanager.demo.home.features.links.title=Registration & reset links
appjars.usermanager.demo.home.features.links.desc=Send expiring self-service links so users set their own password, and follow every link''s status (active, expired or already used) from the user list.
appjars.usermanager.demo.home.features.groups.title=Groups
appjars.usermanager.demo.home.features.groups.desc=Bundle roles into groups and grant them to many users at once, instead of maintaining permissions account by account.
appjars.usermanager.demo.home.features.roles.title=Roles
appjars.usermanager.demo.home.features.roles.desc=Define the roles your application checks and see, for each of them, how many users and groups depend on it before you change anything.
appjars.usermanager.demo.home.features.rules.title=Access rules
appjars.usermanager.demo.home.features.rules.desc=Decide who reaches which URL with prioritized rules where the first match decides, reordered by drag and drop and editable at runtime, with no redeploy.
appjars.usermanager.demo.home.features.views.title=View access matrix
appjars.usermanager.demo.home.features.views.desc=Inspect every route your application registers, the rule that currently governs it and the roles it lets through, so access is auditable instead of guesswork.
appjars.usermanager.demo.home.features.profile.title=Profile & password
appjars.usermanager.demo.home.features.profile.desc=Each user gets a profile page listing their groups and roles, plus a password change dialog with configurable validation rules.
appjars.usermanager.demo.home.features.providers.title=External authentication
appjars.usermanager.demo.home.features.providers.desc=Register OAuth2 providers so users sign in with an existing account, with their client secrets encrypted at rest and the groups they land in decided per provider.
appjars.usermanager.demo.home.features.responsive.title=Responsive out of the box
appjars.usermanager.demo.home.features.responsive.desc=Every screen adapts from desktop to phone, moving filters into dialogs and collapsing columns, without any work on your side.

appjars.usermanager.demo.home.tryit.title=Try it now
appjars.usermanager.demo.home.tryit.intro=Log in with one of these accounts and explore the screens exactly as they ship. Everything you change is stored in a local H2 database, so feel free to break things.
appjars.usermanager.demo.home.tryit.admin=Full administrator: manages users, groups, roles and access rules.
appjars.usermanager.demo.home.tryit.maria=Support lead: can reach the user and group screens, but not roles or access rules.
appjars.usermanager.demo.home.tryit.diego=Read-only account: shows what the access rules hide from a regular user.
appjars.usermanager.demo.home.tryit.users=Users
appjars.usermanager.demo.home.tryit.groups=Groups
appjars.usermanager.demo.home.tryit.roles=Roles
appjars.usermanager.demo.home.tryit.rules=Access rules
appjars.usermanager.demo.home.tryit.views=Views
appjars.usermanager.demo.home.tryit.providers=Auth providers
appjars.usermanager.demo.home.tryit.profile=My profile

appjars.usermanager.demo.home.tour.button=Guided tour

appjars.usermanager.demo.home.license.title=Free vs. full license
appjars.usermanager.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 5 users in total. A full license removes the limit - nothing else changes, so what you see here is what you get.
appjars.usermanager.demo.home.license.link=Get a license at appjars.com

appjars.usermanager.demo.home.links.title=Learn more
appjars.usermanager.demo.home.links.github=AppJars on GitHub
appjars.usermanager.demo.home.links.readme=User Manager documentation

